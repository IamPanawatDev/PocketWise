name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend (.NET 10 Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore backend/PocketWise.sln

      - name: Build Backend Solution
        run: dotnet build backend/PocketWise.sln -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test backend/PocketWise.sln -c Release --no-build --verbosity normal

  frontend-check:
    name: Frontend (Next.js Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pocketwise-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pocketwise-web/package-lock.json

      - name: Install Dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://pocketwise-api-zo94.onrender.com"
          NEXT_PUBLIC_SIGNALR_HUB_URL: "https://pocketwise-api-zo94.onrender.com/hubs/notifications"
